services:
  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    environment:
      - TZ=Europe/Prague
      - PUID=1000
      - PGID=1000
    volumes:
      - npm_data:/data
      - le_data:/etc/letsencrypt

volumes:
  npm_data:
  le_data: