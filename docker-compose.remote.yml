version: '3.8'

# Use this on remote server after pushing custom image
# Update IMAGE to your registry (ghcr.io/USER/nginx-proxy-manager:custom)

services:
  npm:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-youruser}/nginx-proxy-manager:custom
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    environment:
      - TZ=Europe/Prague
      - PUID=1000
      - PGID=1000
      # - INITIAL_ADMIN_EMAIL=admin@example.com
      # - INITIAL_ADMIN_PASSWORD=changeme
    volumes:
      - npm_data:/data
      - le_data:/etc/letsencrypt

volumes:
  npm_data:
  le_data: